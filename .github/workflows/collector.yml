name: GPA News Collector

on:
  workflow_dispatch:
  schedule:
    # Avoid the top-of-hour congestion while still running every 30 minutes.
    - cron: "17,47 * * * *"

permissions:
  contents: write

concurrency:
  group: gpa-news-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
      SEARCH_LOOKBACK_HOURS: "48"
      AUTO_SUMMARY_DAILY_LIMIT: "10"
      MANUAL_SUMMARY_DAILY_LIMIT: "10"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run collector
        run: python collector.py

      # Public repositories can have scheduled workflows disabled after long periods
      # without repository activity. This tiny monthly heartbeat is committed by the
      # built-in GITHUB_TOKEN so the collector can stay hands-off.
      - name: Monthly keepalive
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [ "$(date -u +%d)" = "01" ] && [ "$(date -u +%M)" = "17" ]; then
            mkdir -p .github
            date -u +"%Y-%m-%d" > .github/collector-keepalive
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .github/collector-keepalive
            if ! git diff --cached --quiet; then
              git commit -m "chore: keep scheduled collector active"
              git push
            fi
          fi
